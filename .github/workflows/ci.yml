name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成 Android 工程脚手架
        run: flutter create --platforms=android --org com.xuzhe --project-name jucai .

      - name: 提升 compileSdk 到 36
        run: sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts

      - name: 设置应用显示名
        run: sed -i 's/android:label="jucai"/android:label="聚财"/' android/app/src/main/AndroidManifest.xml

      - name: 获取依赖
        run: flutter pub get

      - name: 删除模板测试
        run: rm -f test/widget_test.dart

      - name: 运行测试
        run: flutter test

      - name: 构建 APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: jucai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
